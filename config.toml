################################# Default configuration ###################
baseURL = "https://www.robertkevinphillips.com"
title = "Robert Phillips"
theme = "airspace-hugo"
# post pagination

[pagination]
pagerSize = 4
# post excerpt
summaryLength = "30"
# disqus short name
disqusShortname = "" # get your shortname form here : https://disqus.com
# disable language
disableLanguages = ["Fr"]


#################################### Plugins ##############################

# CSS Plugins
[[params.plugins.css]]
link = "plugins/bootstrap/bootstrap.min.css"    
[[params.plugins.css]]
link = "plugins/Ionicons/css/ionicons.min.css"
[[params.plugins.css]]
link = "plugins/devicons/css/devicons.min.css"
[[params.plugins.css]]
link = "plugins/fontawesome/css/all.css"
[[params.plugins.css]]
link = "plugins/magnific-popup/magnific-popup.css"
[[params.plugins.css]]
link = "plugins/slick/slick.css"

# JS Plugins
[[params.plugins.js]]
link = "plugins/jQuery/jquery.min.js"
[[params.plugins.js]]
link = "plugins/bootstrap/bootstrap.min.js"
[[params.plugins.js]]
link = "plugins/slick/slick.min.js"
[[params.plugins.js]]
link = "plugins/magnific-popup/jquery.magnific-popup.min.js"
[[params.plugins.js]]
link = "plugins/shuffle/shuffle.min.js"
[[params.plugins.js]]
link = "plugins/google-map/gmap.js"


############################### widgets #################################

[params.widgets]
sidebar = ["recent_posts", "taxonomy_category", "taxonomy_tags"]

############################### taxonomies #################################

#################### default parameters ################################
[params]
logo = "images/logo.png"
# Meta data
description = "Robert Phillips is a technical lead, systems modernizer, and founder of Acer Coffee. Open to serious partnerships, consulting, and meaningful opportunities."
author = "Robert Phillips"
og_image = "images/acer/coffee-cherries.jpg"
# Contact Information
phone = "(678) 662-8857"
email = "rpdecks@gmail.com"
location = "Athens, Georgia"
# contact form action
# contact form works with : https://formspree.io
contact_form_action = "https://formspree.io/mgendwql" 
# Google Analytics (GA4 Measurement ID like G-XXXXXXX)
google_analytics_id = ""
# multi-author support (if set to true, you must use an Array in the author field)
multi_author = false

[markup]
	[markup.goldmark]
		[markup.goldmark.renderer]
			unsafe = true

# Preloader
[params.preloader]
enable = false
preloader = "" # use .png , .svg or .gif format

# Navigation get start button
[params.nav_button]
enable = false
label = "Contact"
link = "#contact"

# google map
[params.gmap]
enable = false
gmap_api = ""
map_latitude = "51.5223477"
map_longitude = "-0.1622023"
map_marker = "images/marker.png"

  
############################# social site ########################
[[params.social]]
icon = "ion-social-facebook-outline" #ionicon pack v2 : https://ionicons.com/v2/
link = "https://acercoffee.com"

[[params.social]]
icon = "ion-social-linkedin-outline" #ionicon pack v2 : https://ionicons.com/v2/
link = "https://www.linkedin.com/in/robertkevinphillips"

[[params.social]]
icon = "devicons devicons-github" 
link = "https://www.github.com/rpdecks"

[[params.social]]
icon = "ion-ios-email" 
link = "mailto:rpdecks@gmail.com"

