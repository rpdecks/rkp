<header class="refresh-site-header">
  <div class="refresh-shell refresh-site-header__inner">
    <a class="refresh-brand" href="{{ "/" | relLangURL }}" aria-label="Robert Phillips home">
      <span class="refresh-brand__mark">RP</span>
      <span class="refresh-brand__text">Robert Phillips</span>
    </a>
    <nav class="refresh-site-nav" aria-label="Primary navigation">
      {{ range site.Menus.main }}
      <a href="{{ .URL | relLangURL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
